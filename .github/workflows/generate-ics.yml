name: Generate KICEA Calendar Feeds

on:
  push:
    branches:
      - main
    paths:
      - 'calendar.html'
      - 'generate_ics.js'
      - '.github/workflows/generate-ics.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate Islamic and KICEA ICS feeds
        run: node generate_ics.js

      - name: Verify generated feeds
        run: |
          set -e

          test -f islamic-calendar.ics
          test -f kicea-events.ics

          echo "Islamic calendar feed:"
          ls -lh islamic-calendar.ics
          echo "Events: $(grep -c 'BEGIN:VEVENT' islamic-calendar.ics)"

          echo "KICEA events feed:"
          ls -lh kicea-events.ics
          echo "Events: $(grep -c 'BEGIN:VEVENT' kicea-events.ics)"

      - name: Commit and push generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add islamic-calendar.ics kicea-events.ics

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update KICEA calendar feeds"
            git push
          fi
