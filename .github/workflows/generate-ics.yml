name: Generate KICEA Calendar Feed

on:
  push:
    branches:
      - main
    paths:
      - 'calendar.html'
      - 'generate_ics.js'
      - '.github/workflows/generate-ics.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate KICEA calendar feed
        run: |
          node generate_ics.js

      - name: Verify generated ICS
        run: |
          if [ ! -f kicea-calendar.ics ]; then
            echo "ERROR: kicea-calendar.ics was not created"
            exit 1
          fi

          echo "ICS file successfully generated:"
          ls -lh kicea-calendar.ics

          echo "Number of calendar events:"
          grep -c "BEGIN:VEVENT" kicea-calendar.ics

      - name: Commit and push ICS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kicea-calendar.ics

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update KICEA calendar feed"
            git push
          fi
