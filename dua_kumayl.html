<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dua Kumayl</title>
<!-- Web fonts: Amiri (Naskh Arabic) and Noto Nastaliq Urdu (Urdu translation) from
     Google Fonts; IndoPak Nastaleeq comes from the Quran Foundation CDN (see CSS).
     They load when online; offline the page falls back to installed fonts. -->
<link rel="preconnect" href="https://verses.quran.foundation" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri&family=Noto+Nastaliq+Urdu&display=swap">
<style>
  :root {
    --bg: #f6f8f7;
    --panel: #ffffff;
    --text: #1d2b2a;
    --muted: #5f716f;
    --accent: #1f6f66;
    --line: #d9e2e0;
    --ar-size: 30px;
    --ar-scale: 1;
    --sw: 1280px;
    --sh: 720px;
    --u: 1px;
    --k: 1px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a19; --panel: #16241f; --text: #e4efec;
      --muted: #93a8a4; --accent: #5fc2b5; --line: #2a3d39;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1a19; --panel: #16241f; --text: #e4efec;
    --muted: #93a8a4; --accent: #5fc2b5; --line: #2a3d39;
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: 90px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.65;
  }

  header.title {
    text-align: center;
    padding: 40px 16px 20px;
  }
  header.title .ar {
    font-family: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", "Geeza Pro", "Times New Roman", serif;
    font-size: 2.6rem;
    margin: 0 auto;
    max-width: none;
    text-align: center;
    color: var(--accent);
  }
  header.title h1 {
    font-size: 1.6rem;
    font-weight: normal;
    margin: 4px 0 6px;
  }
  header.title p {
    margin: 0 auto;
    max-width: 44ch;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .controls {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--panel);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    justify-content: center;
    align-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 0.9rem;
  }
  .controls label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .controls input[type="range"] { width: 110px; }
  .controls button {
    font: inherit;
    padding: 4px 12px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
  }
  .controls button:hover { border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }

  .verse {
    text-align: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .verse .arabic {
    direction: rtl;
    text-align: center;
    font-family: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", "Geeza Pro", "Times New Roman", serif;
    font-size: var(--ar-size);
    line-height: 2.1;
    margin: 0;
  }
  /* IndoPak Nastaleeq: the font Quran.com uses for IndoPak text, loaded from the
     Quran Foundation CDN (needs internet). To use it offline, replace the two url(...)
     sources with a base64 data URL of the same font file. */
  @font-face {
  font-family: 'IndoPak';
  src: url('fonts/1.woff2') format('woff2'),
       url('fonts/1.woff') format('woff'),
       url('fonts/1.tt') format('truetype');
  font-display: swap;
  }
  body.script-ip .verse .arabic {
    font-family: "IndoPak", "Al Qalam Quran Majeed", "Al Qalam Quran", "PDMS Saleem QuranFont", "IndoPak Nastaleeq", "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Noto Naskh Arabic", "Times New Roman", serif;
    line-height: 2.5;
  }
  .controls select {
    font: inherit;
    padding: 3px 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    border-radius: 6px;
  }
  .verse .translit {
    margin: 10px 0 0;
    font-style: italic;
    color: var(--accent);
  }
  .verse .english { margin: 10px 0 0; }
  .verse .urdu {
    direction: rtl;
    text-align: center;
    font-family: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Alvi Nastaleeq", "Noto Naskh Arabic", "Geeza Pro", "Times New Roman", serif;
    font-size: 1.2rem;
    line-height: 2.3;
    margin: 10px 0 0;
  }
  .verse .korean {
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Nanum Gothic", system-ui, sans-serif;
    word-break: keep-all;
    margin: 10px 0 0;
  }

  body.hide-ar .arabic,
  body.hide-tr .translit,
  body.hide-en .english,
  body.hide-ur .urdu,
  body.hide-ko .korean { display: none; }

  .note {
    font-family: system-ui, sans-serif;
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
    margin-top: 24px;
  }

  /* ---------- Slide view: fixed stage for screen capture ---------- */
  .slide-nav { display: inline-flex; align-items: center; gap: 8px; }
  .controls button:disabled { opacity: 0.4; cursor: default; }
  body:not(.slides) .controls .slide-only { display: none; }
  #stage { display: none; }
  body.slides header.title,
  body.slides main { display: none; }
  body.slides #stage {
    display: flex;
    position: fixed;
    top: 0;
    left: 0;
    width: var(--sw);
    height: var(--sh);
    padding: calc(32 * var(--u));
    flex-direction: column;
    align-items: stretch;
    overflow: hidden;
    background: var(--panel);
    color: var(--text);
    z-index: 10;
  }
  #stage .verse {
    width: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
  }
  #stage .verse .arabic  { font-size: calc(64 * var(--k) * var(--ar-scale)); margin: 0; }
  #stage .verse .translit { font-size: calc(26 * var(--k)); margin-top: calc(16 * var(--k)); }
  #stage .verse .english  { font-size: calc(30 * var(--k)); margin-top: calc(14 * var(--k)); }
  #stage .verse .urdu     { font-size: calc(36 * var(--k)); margin-top: calc(14 * var(--k)); }
  #stage .verse .korean   { font-size: calc(30 * var(--k)); margin-top: calc(14 * var(--k)); }
  body.slides .controls { position: absolute; top: var(--sh); left: 0; right: 0; }
  body.slides.clean .controls { display: none; }
  body.slides.clean { overflow: hidden; }

  /* ---------- Logo (swaps with the theme) ---------- */
  :root { --logo-img: var(--logo-light-theme); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --logo-img: var(--logo-dark-theme); }
  }
  :root[data-theme="dark"] { --logo-img: var(--logo-dark-theme); }
  .logo {
    background-image: var(--logo-img);
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
  }
  .logo-header { height: 88px; max-width: 240px; margin: 0 auto 12px; }
  #stage .logo { flex: 0 0 calc(72 * var(--u)); margin-bottom: calc(12 * var(--u)); }
  #stage .slide-body {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @media (max-width: 520px) {
    header.title .ar { font-size: 2.1rem; }
    .verse { padding: 14px; }
  }
  @media print {
    .controls { display: none; }
    body { background: #fff; color: #000; }
    .verse { break-inside: avoid; border-color: #bbb; }
  }
</style>

const root = document.documentElement;
const body = document.body;
const container = document.getElementById("dua");

/* IndoPak letter forms: sukun becomes the small "head of khah" jazm,
   Arabic yeh / alef maqsura become the Urdu yeh, Arabic kaf becomes the Urdu kaf. */
function toIndoPak(s) {
  return s
    .replace(/\u0652/g, "\u06E1")
    .replace(/[\u064A\u0649]/g, "\u06CC")
    .replace(/\u0643/g, "\u06A9");
}
function arabicFor(v) {
  if (scriptSel.value !== "ip") return v.ar;
  return v.ip || toIndoPak(v.ar || "");
}

/* Render */
const arabicEls = [];
VERSES.forEach(v => {
  const el = document.createElement("section");
  el.className = "verse";
  if (v.ar) { const p = document.createElement("p"); p.className = "arabic"; p.lang = "ar"; p.dir = "rtl"; p.textContent = v.ar; el.appendChild(p); arabicEls.push({ p, v }); }
  if (v.tr) { const p = document.createElement("p"); p.className = "translit"; p.textContent = v.tr; el.appendChild(p); }
  if (v.en) { const p = document.createElement("p"); p.className = "english"; p.textContent = v.en; el.appendChild(p); }
  if (v.ur) { const p = document.createElement("p"); p.className = "urdu"; p.lang = "ur"; p.dir = "rtl"; p.textContent = v.ur; el.appendChild(p); }
  if (v.ko) { const p = document.createElement("p"); p.className = "korean"; p.lang = "ko"; p.textContent = v.ko; el.appendChild(p); }
  container.appendChild(el);
});
const note = document.createElement("p");
note.className = "note";
note.textContent = "Sample text only. Add the remaining lines in the VERSES list in this file.";
container.appendChild(note);

/* Preferences (safe if storage is unavailable) */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

function bindToggle(id, cls, key) {
  const box = document.getElementById(id);
  const saved = store.get(key);
  if (saved !== null) box.checked = saved === "1";
  const apply = () => { body.classList.toggle(cls, !box.checked); store.set(key, box.checked ? "1" : "0"); };
  box.addEventListener("change", apply);
  apply();
}
bindToggle("tgAr", "hide-ar", "dk-ar");
bindToggle("tgTr", "hide-tr", "dk-tr");
bindToggle("tgEn", "hide-en", "dk-en");
bindToggle("tgUr", "hide-ur", "dk-ur");
bindToggle("tgKo", "hide-ko", "dk-ko");

const size = document.getElementById("size");
const savedSize = store.get("dk-size");
if (savedSize) size.value = savedSize;
const applySize = () => { root.style.setProperty("--ar-size", size.value + "px"); root.style.setProperty("--ar-scale", size.value / 30); store.set("dk-size", size.value); };
size.addEventListener("input", applySize);
applySize();

const scriptSel = document.getElementById("script");
const savedScript = store.get("dk-script");
if (savedScript === "naskh" || savedScript === "ip") scriptSel.value = savedScript;
function applyScript() {
  const ip = scriptSel.value === "ip";
  body.classList.toggle("script-ip", ip);
  arabicEls.forEach(({ p, v }) => { p.textContent = arabicFor(v); });
  store.set("dk-script", scriptSel.value);
}
scriptSel.addEventListener("change", applyScript);
applyScript();

const savedTheme = store.get("dk-theme");
if (savedTheme) root.setAttribute("data-theme", savedTheme);
document.getElementById("theme").addEventListener("click", () => {
  const isDark = root.getAttribute("data-theme") === "dark" ||
    (!root.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const next = isDark ? "light" : "dark";
  root.setAttribute("data-theme", next);
  store.set("dk-theme", next);
});
/* ---------- Slide view (fixed stage, easy to crop in OBS) ---------- */
const stage = document.getElementById("stage");
const viewSel = document.getElementById("view");
const stageSel = document.getElementById("stageSize");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const counter = document.getElementById("counter");
const cleanBtn = document.getElementById("clean");
const controls = document.querySelector(".controls");
let idx = 0;
let remote = null;

const inSlides = () => body.classList.contains("slides");
const stageDims = () => stageSel.value.split("x").map(Number);

/* Shrink the text until the slide fits inside the fixed stage. */
function fitSlide() {
  if (!inSlides()) return;
  const wrap = stage.querySelector(".verse");
  const area = stage.querySelector(".slide-body");
  if (!wrap || !area) return;
  const u = stageDims()[1] / 720;
  let fit = 1;
  for (;;) {
    stage.style.setProperty("--k", (u * fit) + "px");
    const room = area.clientHeight - 8 * u;
    if (wrap.offsetHeight <= room || fit <= 0.35) break;
    fit -= 0.04;
  }
}

function renderSlide() {
  if (!inSlides()) return;
  stage.textContent = "";
  if (!VERSES.length) { counter.textContent = "0 / 0"; return; }
  idx = Math.max(0, Math.min(idx, VERSES.length - 1));
  const v = VERSES[idx];
  const wrap = document.createElement("section");
  wrap.className = "verse";
  const add = (cls, text, lang, rtl) => {
    if (!text) return;
    const p = document.createElement("p");
    p.className = cls;
    if (lang) p.lang = lang;
    if (rtl) p.dir = "rtl";
    p.textContent = text;
    wrap.appendChild(p);
  };
  add("arabic", arabicFor(v), "ar", true);
  add("translit", v.tr);
  add("english", v.en);
  add("urdu", v.ur, "ur", true);
  add("korean", v.ko, "ko");
  const logo = document.createElement("div");
  logo.className = "logo";
  logo.setAttribute("role", "img");
  logo.setAttribute("aria-label", "KICEA logo");
  const slideBody = document.createElement("div");
  slideBody.className = "slide-body";
  slideBody.appendChild(wrap);
  stage.appendChild(logo);
  stage.appendChild(slideBody);
  counter.textContent = (idx + 1) + " / " + VERSES.length;
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === VERSES.length - 1;
  fitSlide();
  updateRemote();
}

function applyStageSize() {
  const [w, h] = stageDims();
  root.style.setProperty("--sw", w + "px");
  root.style.setProperty("--sh", h + "px");
  root.style.setProperty("--u", (h / 720) + "px");
  store.set("dk-stage", stageSel.value);
  fitSlide();
}

function setView(mode) {
  body.classList.toggle("slides", mode === "slides");
  if (mode !== "slides") body.classList.remove("clean");
  store.set("dk-view", mode);
  renderSlide();
  updateRemote();
}

function go(d) { idx += d; renderSlide(); }

viewSel.addEventListener("change", () => setView(viewSel.value));
stageSel.addEventListener("change", applyStageSize);
prevBtn.addEventListener("click", () => go(-1));
nextBtn.addEventListener("click", () => go(1));
cleanBtn.addEventListener("click", () => setClean(true));
["tgAr", "tgTr", "tgEn", "tgUr", "tgKo"].forEach(id =>
  document.getElementById(id).addEventListener("change", renderSlide));
scriptSel.addEventListener("change", renderSlide);
size.addEventListener("input", fitSlide);

/* Release focus after using a control so the arrow keys keep working for slides. */
controls.addEventListener("change", e => { if (e.target.blur) e.target.blur(); });
controls.addEventListener("click", e => { if (e.target.tagName === "BUTTON") e.target.blur(); });

function setClean(on) {
  body.classList.toggle("clean", on);
  updateRemote();
}

/* Shared by the main page and the remote window. */
function onKey(e, fromRemote) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target.tagName;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(tag)) return;
  if (tag === "BUTTON" && (e.key === " " || e.key === "Enter")) return;
  if (!inSlides()) return;
  switch (e.key) {
    case "ArrowRight": case "ArrowDown": case "PageDown": case " ":
      e.preventDefault(); go(1); break;
    case "ArrowLeft": case "ArrowUp": case "PageUp":
      e.preventDefault(); go(-1); break;
    case "Home": e.preventDefault(); idx = 0; renderSlide(); break;
    case "End": e.preventDefault(); idx = VERSES.length - 1; renderSlide(); break;
    case "h": case "H": setClean(!body.classList.contains("clean")); break;
    case "Escape":
      if (fromRemote) break;
      viewSel.value = "list"; setView("list"); break;
  }
}
document.addEventListener("keydown", e => onKey(e, false));

/* ---------- Remote control window ----------
   A small separate window (always-on-top in Chrome when Picture-in-Picture
   windows are supported, otherwise a normal pop-up). Click it and use the
   big buttons, arrow keys, space or scroll wheel; the captured page never
   needs focus. */
const REMOTE_CSS = `
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;background:#0f1a19;color:#e4efec;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none}
  .pad{padding:12px 12px 8px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  #rcount{font-size:1.5rem;font-weight:600}
  .top button{font:inherit;font-size:.85rem;padding:6px 10px;border:1px solid #2a3d39;background:transparent;color:inherit;border-radius:8px;cursor:pointer}
  .big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .big button{font:inherit;font-size:1.5rem;min-height:96px;border:0;border-radius:14px;background:#1f6f66;color:#fff;cursor:pointer}
  .big button.prev{background:#2a3d39}
  .big button:active{filter:brightness(1.3)}
  button:disabled{opacity:.35;cursor:default}
  .hint{margin:8px 0 0;font-size:.75rem;color:#93a8a4}
  #rlist{flex:1;overflow:auto;padding:4px 12px 12px;display:flex;flex-direction:column;gap:6px}
  #rlist button{font:inherit;font-size:.9rem;text-align:left;padding:8px 10px;border:1px solid #2a3d39;border-radius:8px;background:#16241f;color:inherit;cursor:pointer}
  #rlist button.on{border-color:#5fc2b5;background:#1c3630}
`;
const REMOTE_BODY = `
  <div class="pad">
    <div class="top">
      <span id="rcount">1 / 1</span>
      <button id="rclean" type="button">Hide toolbar</button>
    </div>
    <div class="big">
      <button id="rprev" class="prev" type="button">‹ Prev</button>
      <button id="rnext" type="button">Next ›</button>
    </div>
    <p class="hint">Arrow keys, Space, or the scroll wheel over this area also change slides.</p>
  </div>
  <div id="rlist"></div>
`;

function remoteAlive() {
  try { return !!remote && !remote.closed; } catch (e) { return false; }
}

function buildRemoteList() {
  const d = remote.document;
  const list = d.getElementById("rlist");
  list.textContent = "";
  VERSES.forEach((v, i) => {
    const b = d.createElement("button");
    b.type = "button";
    const label = (v.en || v.tr || v.ar || "").trim();
    b.textContent = (i + 1) + ".  " + (label.length > 60 ? label.slice(0, 60) + "…" : label);
    b.addEventListener("click", () => { idx = i; renderSlide(); });
    list.appendChild(b);
  });
}

function updateRemote() {
  if (!remoteAlive()) return;
  try {
    const d = remote.document;
    const count = d.getElementById("rcount");
    if (!count) return;
    count.textContent = (idx + 1) + " / " + VERSES.length;
    d.getElementById("rprev").disabled = idx === 0;
    d.getElementById("rnext").disabled = idx >= VERSES.length - 1;
    d.getElementById("rclean").textContent = body.classList.contains("clean") ? "Show toolbar" : "Hide toolbar";
    d.querySelectorAll("#rlist button").forEach((b, i) => {
      b.classList.toggle("on", i === idx);
      if (i === idx) b.scrollIntoView({ block: "nearest" });
    });
  } catch (e) { /* window went away */ }
}

function mountRemote(w) {
  const d = w.document;
  d.head.textContent = "";
  d.title = "Dua remote";
  const st = d.createElement("style");
  st.textContent = REMOTE_CSS;
  d.head.appendChild(st);
  d.body.innerHTML = REMOTE_BODY;

  const $ = id => d.getElementById(id);
  $("rprev").addEventListener("click", () => go(-1));
  $("rnext").addEventListener("click", () => go(1));
  $("rclean").addEventListener("click", () => setClean(!body.classList.contains("clean")));
  d.addEventListener("keydown", e => onKey(e, true));

  let lastWheel = 0;
  d.querySelector(".pad").addEventListener("wheel", e => {
    e.preventDefault();
    const now = Date.now();
    if (now - lastWheel < 200 || Math.abs(e.deltaY) < 4) return;
    lastWheel = now;
    go(e.deltaY > 0 ? 1 : -1);
  }, { passive: false });

  w.addEventListener("pagehide", () => { if (remote === w) remote = null; });
  buildRemoteList();
  updateRemote();
}

async function openRemote() {
  if (remoteAlive()) { try { remote.focus(); } catch (e) {} return; }
  let w = null;
  if (window.documentPictureInPicture) {
    try { w = await window.documentPictureInPicture.requestWindow({ width: 380, height: 600 }); }
    catch (e) { w = null; }
  }
  if (!w) {
    w = window.open("", "dua-remote", "popup,width=380,height=600");
    if (!w) { alert("The browser blocked the remote window. Allow pop-ups for this page and try again."); return; }
  }
  remote = w;
  mountRemote(w);
  if (!inSlides()) { viewSel.value = "slides"; setView("slides"); }
  updateRemote();
}

document.getElementById("remoteBtn").addEventListener("click", openRemote);
window.addEventListener("pagehide", () => { if (remoteAlive()) { try { remote.close(); } catch (e) {} } });

const savedStage = store.get("dk-stage");
if (savedStage && [...stageSel.options].some(o => o.value === savedStage)) stageSel.value = savedStage;
applyStageSize();
if (store.get("dk-view") === "slides") viewSel.value = "slides";
setView(viewSel.value);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitSlide);
if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", fitSlide);
</script>
</body>
